{% extends "dashboard/base.html" %}

{% block title %}
    <title>Новое наблюдение</title>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-4"></div>
    <div class="col-4">
        <h3>Новое наблюдение</h3>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            {{ field|as_crispy_field }}
            {% endfor %}
            <button class="w-100 btn btn-lg btn-primary mt-5" type="submit">Сохранить</button>
        </form>
    </div>
    <div class="col-4"></div>
</div>
{% endblock %}
